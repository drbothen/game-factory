---
# release — game-factory core cross-compile pipeline
#
# Decision D-009 (STATE.md): "Extracted core needs its own release/cross-compile
# pipeline — owner: devops-engineer, target Phase 1+".
#
# Triggers on semver tag push (vX.Y.Z).  Builds the factory-core binary for:
#   - x86_64-unknown-linux-musl   (Linux; primary CI runner / headless server)
#   - aarch64-apple-darwin        (macOS M-series; developer workstation)
#   - x86_64-apple-darwin         (macOS Intel; legacy developer machines)
#   - x86_64-pc-windows-msvc      (Windows; Unity adapter target environment)
#
# The cross-compile matrix reflects the founding adapter pair requirements:
#   - Bevy (T1: bitwise-cross-platform) — runs on Linux CI cleanly.
#   - Unity (T2: same-machine) — Windows target is required for Unity Build Server
#     licensing and Windows-only adapter tests.
#   - macOS coverage ensures the developer workflow is end-to-end verified.
#
# All binaries are attached to the GitHub Release.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # build-matrix — cross-compile factory-core for all target triples
  # ─────────────────────────────────────────────────────────────────────────────
  build-matrix:
    name: release / build (${{ matrix.target }})
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            cross: true        # uses cross-rs for musl linking
            binary_suffix: ""
          - target: aarch64-apple-darwin
            os: macos-14       # GitHub-hosted M1 runner
            cross: false
            binary_suffix: ""
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
            binary_suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            cross: false
            binary_suffix: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain (stable + target)
        uses: dtolnay/rust-toolchain@fcf085536bf67f4944bd6c4a87e63cb4c08eb5de  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd0d05  # v2.7.8
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross (musl target only)
        if: matrix.cross == true
        uses: taiki-e/install-action@7c0a0060d577e9d44cbddf0b5c2d4e16f80dc2e4  # v2.49.51
        with:
          tool: cross

      - name: Build release binary (cross)
        if: matrix.cross == true
        shell: bash
        run: |
          set -euo pipefail
          cross build --workspace --release --target ${{ matrix.target }} 2>&1 || {
            echo "[release-build] Empty workspace — no packages yet.  Skipping."
            mkdir -p dist
            touch dist/.empty-workspace
            exit 0
          }

      - name: Build release binary (native)
        if: matrix.cross == false
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --release --target ${{ matrix.target }} 2>&1 || {
            echo "[release-build] Empty workspace — no packages yet.  Skipping."
            mkdir -p dist
            touch dist/.empty-workspace
            exit 0
          }

      - name: Collect release artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # When workspace is populated, factory-dispatcher and factory-replay
          # binaries will be collected here.
          for bin in factory-dispatcher factory-replay; do
            SRC="target/${{ matrix.target }}/release/${bin}${{ matrix.binary_suffix }}"
            if [ -f "$SRC" ]; then
              DEST="dist/${bin}-${{ matrix.target }}${{ matrix.binary_suffix }}"
              cp "$SRC" "$DEST"
              echo "Collected: $DEST"
            fi
          done
          ls -lh dist/ || true

      - name: Upload release artefact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: release-${{ matrix.target }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # run-tests — final verification pass before publishing
  # ─────────────────────────────────────────────────────────────────────────────
  run-tests:
    name: release / test (final)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@fcf085536bf67f4944bd6c4a87e63cb4c08eb5de  # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry + build artefacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd0d05  # v2.7.8
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7c0a0060d577e9d44cbddf0b5c2d4e16f80dc2e4  # v2.49.51
        with:
          tool: cargo-nextest

      - name: Final test suite
        run: |
          set -euo pipefail
          cargo nextest run --workspace --all-features --profile ci 2>&1 || {
            echo "[release-test] Empty workspace. Exiting 0."
            exit 0
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # publish-release — create GitHub Release + attach binaries
  # Requires both build-matrix and run-tests to succeed.
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: release / publish
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [build-matrix, run-tests]
    permissions:
      contents: write   # required: create release + upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all build artefacts
        uses: actions/download-artifact@fa0a91b85d4f404e444306234f91f42f8c70082e  # v4.1.8
        with:
          path: release-artefacts/
          pattern: release-*
          merge-multiple: true

      - name: List collected artefacts
        run: ls -lhR release-artefacts/ || echo "No artefacts collected yet."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-artefacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
